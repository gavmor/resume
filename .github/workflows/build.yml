name: Build and release resume PDF

# Every push to main renders the résumé PDF from resume.html with WeasyPrint
# and cuts a semver GitHub release carrying the PDF.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: resume-pdf-main
  cancel-in-progress: false

jobs:
  build:
    name: Render PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            fonts-liberation \
            fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Render resume PDF
        run: |
          test -f resume.html
          mkdir -p dist
          weasyprint resume.html dist/Gavin-Morgan-Resume.pdf

      - name: Check generated files
        run: |
          test -s dist/Gavin-Morgan-Resume.pdf
          ls -lh dist/*.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf-${{ github.run_number }}
          path: dist/*.pdf
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf-${{ github.run_number }}
          path: dist

      - name: Compute next semantic version
        id: semver
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            major=1; minor=0; patch=0
          else
            ver="${latest#v}"
            IFS=. read -r major minor patch <<< "$ver"
            case "$BUMP" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              *)     patch=$((patch+1)) ;;
            esac
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Next version: v$major.$minor.$patch (bump: $BUMP, previous: ${latest:-none})"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.semver.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.semver.outputs.version }}" \
            --generate-notes \
            dist/Gavin-Morgan-Resume.pdf
